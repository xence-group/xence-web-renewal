<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XENCE — Waste in. Assets out.</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#fff;text-decoration:none}a:hover{color:#FF5528}
.en{font-family:Montserrat,sans-serif}
@keyframes rise{from{transform:translateY(110%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes reveal{from{opacity:0;transform:translateY(48px)}to{opacity:1;transform:none}}
@keyframes zoomout{from{transform:scale(1.18)}to{transform:scale(1)}}
@keyframes heroPar{to{transform:translateY(18%) scale(1.06)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.6)}to{opacity:1;transform:none}}
.mask{display:block;overflow:hidden}
.mask>span{display:block;animation:rise 1.1s cubic-bezier(.2,.8,.1,1) both}
.d1>span{animation-delay:.15s}
.fadein{animation:fade 1.4s .7s both}
.track{display:flex;width:max-content;animation:marquee 42s linear infinite}
.bar{transform-origin:left;animation:bar 6s linear both}
.live{animation:pulse 1.6s infinite}
.zoom{overflow:hidden}.zoom img{transition:transform 1.2s cubic-bezier(.2,.8,.1,1)}.zoom:hover img{transform:scale(1.06)}
.row{transition:background .3s}.row:hover{background:#151514}
.ln{transition:transform 1.1s cubic-bezier(.7,0,.2,1)}
.spin{transform-box:view-box;transform-origin:200px 200px;animation:spin 9s linear infinite}
.tree{animation:pop .45s cubic-bezier(.2,.8,.1,1) both}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}
@supports (animation-timeline: view()){
.reveal{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% cover 28%}
.revealimg img{animation:zoomout linear both;animation-timeline:view();animation-range:entry 0% cover 60%}
.par{animation:heroPar linear both;animation-timeline:scroll();animation-range:0 100vh}
}
.xroot{font-family:Montserrat, 'Zen Kaku Gothic New', sans-serif;color:#fff;background:#000;overflow-x:hidden}
@supports (overflow-x: clip){.xroot{overflow-x:clip}}
.xroot h1,.xroot h2,.xroot h3{color:inherit}
#mission .hero-copy h1{word-break:keep-all}
section[id]{scroll-margin-top:76px}
@media (max-width: 1100px){.mods-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media (max-width: 760px){
#mission .hero-shade{background:linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 38%, rgba(0,0,0,0.88) 62%, #000 100%)!important}
#mission .hero-copy{bottom:96px!important;max-width:none!important}
#mission .hero-cap{display:none}
.mods-grid{grid-template-columns:1fr!important}
header .lang{font-size:12px}
#works figure{width:80vw!important}

.aw-row{gap:18px!important;flex-direction:column;align-items:flex-start!important}
.aw-logos{gap:22px 28px!important}
.aw-logos{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));align-items:center;width:100%;gap:24px 28px!important}
.aw-logo{height:auto!important;max-height:48px;max-width:100%}
#awards{padding:28px 6vw!important}
.news-row{grid-template-columns:minmax(0,1fr) 20px !important;gap:6px 12px !important}
.news-row > span:first-child{grid-column:1 / -1}

header{padding:18px 5vw!important;flex-wrap:nowrap!important}
header nav{gap:0!important}
header nav > a:not([href="#contact"]){display:none!important}
header nav > span.lang{order:-1;margin-right:16px}
header nav > a[href$="/contact/"]{padding:10px 16px!important;font-size:12px!important}
header > div{font-size:20px!important}
#mission{height:100svh!important;min-height:600px!important}
#mission h1{font-size:7.4vw!important;line-height:1.22!important;letter-spacing:0!important}
#mission > div:nth-of-type(3){left:5vw!important;right:5vw!important;bottom:84px!important}
#mission .fadein{margin-bottom:14px!important}
#mission .fadein + h1 + .fadein{gap:14px!important;margin-top:20px!important}
#mission .fadein p:first-child{font-size:17px!important}
#mission .fadein p:last-child{font-size:13.5px!important;line-height:1.8!important}
#mission .track{font-size:12px!important;gap:32px!important}
#mission > div:last-child{padding:14px 0!important}
section:not(#mission){padding:72px 5vw!important}
section h2{font-size:25px!important;line-height:1.45!important;letter-spacing:0!important}
section h3{font-size:18px!important}
section p{font-size:14px;}
section [style*="font-size: 18px"], section [style*="font-size: 17px"], section [style*="font-size: 16px"]{font-size:14.5px!important}
section [style*="letter-spacing: 0.22em"]{font-size:11px!important;margin-bottom:10px!important}
section [style*="margin-top: 96px"], section [style*="margin-top: 88px"]{margin-top:40px!important}
section [style*="margin-bottom: 64px"], section [style*="margin-bottom: 56px"]{margin-bottom:32px!important}
section [style*="gap: 72px"], section [style*="gap: 64px"], section [style*="gap: 48px"]{gap:28px!important}
section [style*="clamp(48px, 5vw, 80px)"]{font-size:40px!important}
section [style*="clamp(44px, 4.4vw, 68px)"]{font-size:36px!important}
section [style*="font-size: 36px"]{font-size:26px!important}
section [style*="padding: 36px"]{padding:24px 20px!important}
section [style*="padding: 28px"]{padding:20px!important}
section img[style*="height: 320px"]{height:200px!important}
section [style*="margin-top: 48px"]{margin-top:24px!important}
#model svg{max-width:340px!important}
#technology [role="tablist"] button{padding:14px 0!important}
#technology [role="tablist"] button > span:nth-child(2) > span:first-child{font-size:16px!important}
#technology .tech-media [style*="padding: 16px 24px"]{display:none!important}
#technology .tech-wrap{flex-direction:column!important;gap:12px!important}
#technology [role="tablist"]{flex:none!important}
#technology .tech-media{order:-1;position:sticky!important;top:0;z-index:3;width:100%;flex:none!important;aspect-ratio:16 / 11!important;outline:12px solid #000}
#configurator .cfg-wrap{flex-direction:column!important;gap:12px!important}
#configurator .cfg-right{display:contents!important}
#configurator .cfg-3d{aspect-ratio:4 / 3!important}
#configurator .cfg-view{order:-1;position:sticky!important;top:0;z-index:3;border:1px solid #000;outline:10px solid #F4F3F1}
#configurator .cfg-ctrl{flex:none!important;order:0}
#configurator .cfg-trees{order:1;border:1px solid #000}
#configurator [role="group"] button{padding:8px 14px!important;min-height:38px!important}
#configurator button[aria-pressed][style*="padding: 18px"]{padding:13px!important;font-size:15px!important}
#configurator [style*="padding: 16px"]{padding:12px!important}
#configurator [style*="padding: 32px"]{padding:20px!important;gap:20px!important}
.stats3{gap:14px!important;margin-top:36px!important}
.stats3 > div{padding-top:12px!important}
.stats3 > div > p:first-child{font-size:26px!important}
.stats3 > div > p:last-child{font-size:11.5px!important;line-height:1.6!important;margin-top:6px!important}
#configurator .cfg-stats{width:96px!important;gap:10px!important;padding:34px 12px 10px 0!important}
#configurator .cfg-stats p:first-child{font-size:10px!important}
#configurator .cfg-stats p:last-child{font-size:17px!important;margin-top:2px!important}
#configurator .cfg-stats span{font-size:10px!important}
#configurator [style*="minmax(150px, 220px)"]{grid-template-columns:1fr!important;gap:6px!important}
#configurator [style*="padding: 24px 28px"]{padding:18px!important}
#modules .zoom{aspect-ratio:16 / 10!important}
#projects aside{order:-1;position:static!important;flex-basis:100%!important}
#projects .zoom, #projects aside [style*="height: 320px"]{height:220px!important}
#projects [style*="min-width: 680px"]{min-width:0!important;grid-template-columns:28px 1fr auto!important;gap:10px!important}
#projects [style*="min-width: 680px"] > :nth-child(3), #projects [style*="min-width: 680px"] > :nth-child(4){display:none!important}
#projects .row{padding:14px 6px!important}
#projects .row > span:nth-child(2){font-size:14.5px!important}
#projects [role="group"] button{padding:8px 12px!important;min-height:38px!important;font-size:12.5px!important}
#studio [style*="minmax(240px"]{grid-template-columns:1fr 1fr!important;gap:28px 16px!important}
#studio [style*="font-size: 19px"]{font-size:15px!important}
#contact [style*="font-size: 22px"]{font-size:18px!important}
footer{padding:40px 5vw!important;font-size:12px!important}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
input[type=range]{accent-color:#FF5528;width:100%;height:28px}
</style>
<style>html,body{margin:0;background:#000}html{scroll-behavior:smooth}</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/en/app.js"></script>
</body>
</html>
