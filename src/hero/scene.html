  if(v>yF[k-1]&&v>=yF[k+1]&&v>yF[k-NX-1]&&v>=yF[k+NX+1])apex.push(new THREE.Vector3(X(i),v,Z(j)));}

// ---------- materials ----------

const clipPlane=new THREE.Plane(new THREE.Vector3(0,0,-1),100);

// plain ground (for final)
const ground2=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x161616,roughness:.9,transparent:true,opacity:0}));ground2.rotation.x=-Math.PI/2;ground2.position.y=.01;ground2.receiveShadow=true;scene.add(ground2);
// slab

// ---------- members (diagrid) ----------

// force ~ q*L (uniform q)
const Lref=Math.hypot(LX/NX,LZ/NZ);

// ---------- trees ----------
const treeGrp=new THREE.Group();scene.add(treeGrp);

// ---------- roof panels ----------
const cells=[];for(let j=0;j<NZ;j++)for(let i=0;i<NX;i++)cells.push([id(i,j),id(i+1,j),id(i+1,j+1),id(i,j+1)]);
function quadGeo(n){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*12),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(n*12),3));

  return {alt,v:new THREE.Vector3(-Math.sin(az)*Math.cos(alt),Math.sin(alt),Math.cos(az)*Math.cos(alt))};}
for(let doy=0;doy<365;doy+=10)for(let hr=4;hr<=20;hr+=.5){const s=sunVec(doy,hr);if(s.alt>0.03){const am=1/Math.sin(s.alt);sunDirs.push([s.v,1000*Math.pow(.7,Math.pow(am,.678))]);}}

{for(let k=0;k<N;k++)yNow[k]=yF[k];let mn=1e9,mxx=0;
 cells.forEach((c,ci)=>{const a=pos(c[0]),b=pos(c[1]),cc=pos(c[2]),d=pos(c[3]);const n=new THREE.Vector3().subVectors(cc,a).cross(new THREE.Vector3().subVectors(d,b)).normalize();if(n.y<0)n.negate();
  let s=0;for(const [v,dni] of sunDirs){const cs=n.dot(v);if(cs>0)s+=dni*cs;}irr[ci]=s;mn=Math.min(mn,s);mxx=Math.max(mxx,s);});
 const ord=[...irr.keys()].sort((x,y)=>irr[x]-irr[y]);const rk=new Float32Array(irr.length);ord.forEach((ci,r)=>rk[ci]=r/(ord.length-1));for(let i=0;i<irr.length;i++)irr[i]=.5*(irr[i]-mn)/(mxx-mn)+.5*rk[i];}

function updateRoof(colorMode,glassReveal,shadeAmt){
  const gp=glassGeo.attributes.position.array,gc=glassGeo.attributes.color.array,sp=shadeGeo.attributes.position.array;
  cells.forEach((c,ci)=>{const pts=c.map(pos);const ctr=pts.reduce((a,p)=>a.add(p),new THREE.Vector3()).multiplyScalar(.25);
    const n=new THREE.Vector3().subVectors(pts[2],pts[0]).cross(new THREE.Vector3().subVectors(pts[3],pts[1])).normalize();if(n.y<0)n.negate();

// ---------- sun path arcs ----------
const sunGrp=new THREE.Group();scene.add(sunGrp);const R=46;
const arcMat=new THREE.LineBasicMaterial({color:0x8a877f,transparent:true,opacity:0});
for(const doy of [172,80,355]){const pts=[];for(let hr=3;hr<=21;hr+=.1){const s=sunVec(doy,hr);if(s.alt>-0.02)pts.push(s.v.clone().multiplyScalar(R));}
  sunGrp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),arcMat));}
// horizon ring
{const pts=[];for(let a=0;a<=Math.PI*2+.01;a+=.02)pts.push(new THREE.Vector3(Math.cos(a)*R,0.02,Math.sin(a)*R));sunGrp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),arcMat));}

// ---------- airflow ----------
const flowN=MOB?150:220, flowSeg=60;

{let rnd=1;const R1=()=>(rnd=(rnd*16807)%2147483647)/2147483647;

  // nearest apex on z<=0 half preference

// ---------- interior: beds, plants, people ----------
const intGrp=new THREE.Group();scene.add(intGrp);
const bedMat=new THREE.MeshStandardMaterial({color:0x2c2b28,roughness:.9,clippingPlanes:[clipPlane]});
const plantMat=new THREE.MeshStandardMaterial({color:0x6f7a62,roughness:.85,clippingPlanes:[clipPlane]});
const plants=[];
for(const bz of [-9,-6,6,9])for(const seg of [[-28,-19],[-11,-4],[4,11],[19,28]]){const L=seg[1]-seg[0];const b=new THREE.Mesh(new THREE.BoxGeometry(L,.5,1.6),bedMat);b.position.set((seg[0]+seg[1])/2,.55,bz);b.castShadow=b.receiveShadow=true;intGrp.add(b);
  for(let x=seg[0]+.3;x<seg[1];x+=.42)for(const dz of [-.45,0,.45])plants.push([x,bz+dz]);}

plants.forEach((p,i)=>{const hh=.7+((i*37)%11)*.07;_m.compose(new THREE.Vector3(p[0]+((i*29)%5-2)*.05,.8+hh*.3,p[1]+((i*13)%5-2)*.06),new THREE.Quaternion().setFromEuler(new THREE.Euler(i,i*2.3,i*.7)),new THREE.Vector3(.8,hh,.8));plantIM.setMatrixAt(i,_m);});intGrp.add(plantIM);
const pplMat=new THREE.MeshStandardMaterial({color:0x8a877f,roughness:.9,clippingPlanes:[clipPlane]});
const people=[[-6,0.5,1],[-4.8,-.4,1],[7,1.5,1],[22,-1,1],[-21,1,1],[33,8,0],[35.5,9.5,0],[-34,10,0]];
for(const [x,z] of people){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.CapsuleGeometry(.24,1.05,4,10),pplMat);b.position.y=.3+.77;const h=new THREE.Mesh(new THREE.SphereGeometry(.13,12,8),pplMat);h.position.y=.3+1.6;b.castShadow=h.castShadow=true;g.add(b,h);g.position.set(x,z>7?-0.3:0,z);intGrp.add(g);}
// warm interior lights
const warmL=[];for(const x of [-22,-8,8,22])for(const z of [-5,5]){const l=new THREE.PointLight(0xffb98a,0,13,2);l.position.set(x,2.6,z*1.2);scene.add(l);warmL.push(l);}

// ---------- lights ----------
const hemi=new THREE.HemisphereLight(0xe9e6df,0x141412,.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-45,right:45,top:30,bottom:-30,near:1,far:200});sun.shadow.bias=-.0004;sun.shadow.normalBias=.05;sun.shadow.radius=4;scene.add(sun,sun.target);

const comp=new EffectComposer(renderer,rt);comp.addPass(new RenderPass(scene,cam));

// ---------- overlay ----------
const ov=document.getElementById('ov');const u=Math.min(W,H)/1080;

const chap=[['01','STRUCTURE','Form-finding · compression shell','AXIAL FORCE','linear-gradient(90deg,#2f2e2b,#696660,#FF5528,#FFE3D6)'],

function herm(keys,t,idx){let k=0;while(k<keys.length-2&&t>keys[k+1][0])k++;
  const t0=keys[k][0],t1=keys[k+1][0];const s=Math.min(1,Math.max(0,(t-t0)/(t1-t0)));
  const P0=keys[Math.max(0,k-1)],P1=keys[k],P2=keys[k+1],P3=keys[Math.min(keys.length-1,k+2)];
  const out=[0,0,0];for(let a=0;a<3;a++){const p1=P1[idx][a],p2=P2[idx][a];
    const m1=k==0?0:(P2[idx][a]-P0[idx][a])/(P2[0]-P0[0])*(t1-t0);const m2=k+2>=keys.length?0:(P3[idx][a]-P1[idx][a])/(P3[0]-P1[0])*(t1-t0);
    const s2=s*s,s3=s2*s;out[a]=(2*s3-3*s2+1)*p1+(s3-2*s2+s)*m1+(-2*s3+3*s2)*p2+(s3-s2)*m2;}return out;}
