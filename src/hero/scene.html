})();

{let k=0;for(let b=MOVEB0;b<NB;b++)for(let cz=0;cz<NCZ;cz++){const cas=b*NCZ+cz;const ctr=new THREE.Vector3();let cnt=0;
  for(let i=b*BAYC;i<=b*BAYC+BAYC;i++)for(let j=cz*CASZ;j<=cz*CASZ+CASZ;j++){ctr.add(npos(id(i,j),_a));cnt++;}ctr.multiplyScalar(1/cnt);
  const n=arcN[cz*CASZ].clone().add(arcN[cz*CASZ+CASZ]).normalize();const X=new THREE.Vector3(1,0,0),Y=new THREE.Vector3().crossVectors(n,X);
  const A=new THREE.Matrix4().makeBasis(X,Y,n).setPosition(ctr);
  const stack=Math.floor(k/4),lvl=k%4;k++;
  const S=new THREE.Matrix4().makeBasis(new THREE.Vector3(1,0,0),new THREE.Vector3(0,0,-1),new THREE.Vector3(0,1,0)).setPosition(-14+stack*7.2,0.35+lvl*0.42,19);
  casPose.set(cas,{A,Ainv:A.clone().invert(),S,k:k-1});}}
const pa=new THREE.Vector3(),qa=new THREE.Quaternion(),sa=new THREE.Vector3(),pb=new THREE.Vector3(),qb=new THREE.Quaternion(),sb=new THREE.Vector3();
function poseLerp(M1,M2,t,lift,out){M1.decompose(pa,qa,sa);M2.decompose(pb,qb,sb);pa.lerp(pb,t);pa.y+=Math.sin(Math.PI*t)*lift;qa.slerp(qb,t);return out.compose(pa,qa,sa.set(1,1,1));}
const _T=new THREE.Matrix4(),_F=new THREE.Matrix4();
function casMatrix(cas,t){const P=casPose.get(cas);if(!P||t<34.6)return null;const st=P.k*0.05;

  _F.copy(P.A);_F.elements[12]+=SHIFT;return poseLerp(P.S,_F,r2,5,_T).multiply(P.Ainv);}

// ---------- timeline ----------
const DUR=40;
const WIN=[[0.4,8.4],[8.6,14],[14.2,19.6],[19.8,24.6],[24.8,29.4],[29.6,33.8],[34.2,39.2]];

const NT=NODEC.toArray();
const K=MOB?[
 [0,[30,52,100],[0,3,8]],[8.4,[50,36,92],[0,4,2]],[14,[70,46,96],[0,6,0]],[19.6,[60,48,96],[0,6,0]],[21.5,[16,14,72],[0,4.5,0]],[24.6,[-8,11,62],[0,4.5,0]],[27,[46,5,66],[2,5,0]],[29.4,[30,4,58],[0,6,0]],
 [31.0,nd(4.0,2.0,1.2),NT,1],[32.3,nd(2.3,1.0,0.6),NT,1],[33.7,nd(1.8,0.8,0.45),NT,1],[35.4,[30,34,96],[-6,3,6]],[40,[16,40,104],[-10,3,4]]]:[
 [0,[48,44,76],[0,3,8]],[8.4,[58,28,66],[0,4,2]],[14,[62,40,70],[0,6,0]],[19.6,[64,42,72],[0,6,0]],[21.5,[12,10,48],[0,4.5,0]],[24.6,[-10,8,42],[0,4.5,0]],[27,[40,2.6,38],[0,5,0]],[29.4,[24,2.4,32],[0,5.5,0]],
 [31.0,nd(2.6,1.5,0.8),NT,1],[32.3,nd(1.75,0.9,0.5),NT,1],[33.7,nd(1.3,0.62,0.36),NT,1],[35.4,[42,30,70],[-6,3,6]],[40,[30,34,78],[-10,3,4]]];
function herm(keys,t,idx){let k=0;while(k<keys.length-2&&t>keys[k+1][0])k++;
  const t0=keys[k][0],t1=keys[k+1][0];const s=cl((t-t0)/(t1-t0));const P0=keys[Math.max(0,k-1)],P1=keys[k],P2=keys[k+1],P3=keys[Math.min(keys.length-1,k+2)];
  const out=[0,0,0];for(let a=0;a<3;a++){const p1=P1[idx][a],p2=P2[idx][a];const m1=(k==0||P1[3])?0:(P2[idx][a]-P0[idx][a])/(P2[0]-P0[0])*(t1-t0);const m2=(k+2>=keys.length||P2[3])?0:(P3[idx][a]-P1[idx][a])/(P3[0]-P1[0])*(t1-t0);
    const s2=s*s,s3=s2*s;out[a]=(2*s3-3*s2+1)*p1+(s3-2*s2+s)*m1+(-2*s3+3*s2)*p2+(s3-s2)*m2;}return out;}
const viewShift=t=>{const close=sm(29.6,31,t)*(1-sm(33.8,34.9,t));return MOB?[0,H*.12*(1-close)]:[-W*.17*(1-close),0];};

const pQ=new THREE.Vector3(),qQ=new THREE.Quaternion(),pF=new THREE.Vector3(),qF=new THREE.Quaternion(),sF=new THREE.Vector3(),_M=new THREE.Matrix4();
window.renderAt=function(t){

  const moved=t>=34.4, landed=t>=38.9;

  for(let n=0;n<NMEM;n++){const e=mem[n];
    memberMatrix(e,_M);
    const s=cl((t-e.start)/FLY);if(s>=1)nAlloc++;
    if(s<1){_M.decompose(pF,qF,sF);const es=ease(s);pQ.copy(e.pile.p).lerp(pF,es);pQ.y+=Math.sin(Math.PI*es)*4.5;qQ.copy(e.pile.q).slerp(qF,es);sF.y=lerp(e.pile.L,sF.y,es);_M.compose(pQ,qQ,sF);}

      if(e.bay>=MOVEB0&&t>34.2&&t<39.4){_c.lerp(C.orange,0.35*sm(34.2,34.6,t)*(1-sm(38.9,39.4,t)));}}
    ims[e.proto].setColorAt(e.pi,_c);
    npos(e.a,_a);npos(e.b,_b);gpos.set([_a.x,_a.y,_a.z,_b.x,_b.y,_b.z],n*6);
  }
  ims.forEach(im=>{im.instanceMatrix.needsUpdate=true;im.instanceColor.needsUpdate=true;});
  ghost.geometry.attributes.position.needsUpdate=true;ghost.material.opacity=sm(0.3,1.4,t)*(1-sm(7.6,9,t))*.55;
  if(c1){c1.textContent=nAlloc.toLocaleString('en');c2.textContent=(NMEM-nAlloc).toLocaleString('en');}
  // cassette outlines (shown just before relocation, and after landing)
  {const cp=caseLines.geometry.attributes.position.array;let o=0;const sh=landed?SHIFT:0;
   for(let b=0;b<NB;b++)for(let cz=0;cz<NCZ;cz++){const i0=b*BAYC,i1=i0+BAYC,j0=cz*CASZ,j1=j0+CASZ;const cs=[id(i0,j0),id(i1,j0),id(i1,j1),id(i0,j1)].map(k=>{const p=npos(k,new THREE.Vector3()).addScaledVector(arcN[Math.floor(k/(NX+1))],0.2);if(b>=MOVEB0)p.x+=sh;return p;});
     for(let q=0;q<4;q++){const A=cs[q],B=cs[(q+1)%4];cp.set([A.x,A.y,A.z,B.x,B.y,B.z],o);o+=6;}}
   caseLines.geometry.attributes.position.needsUpdate=true;caseLines.material.opacity=(sm(33.6,34.3,t)*(1-sm(34.5,34.9,t))+sm(38.9,39.3,t)*(1-sm(39.6,40,t)))*0.9;}
  // hubs
  {const hv=sm(7,8.2,t);const q=new THREE.Quaternion();for(let k=0;k<NN;k++){npos(k,_a);q.setFromUnitVectors(new THREE.Vector3(0,0,1),arcN[Math.floor(k/(NX+1))]);
    const i=k%(NX+1);const b=bayOf(Math.min(i,NX-1));let sc=hv;if(i>=MOVEB0*BAYC&&moved)sc*=landed?sm(38.9,39.3,t):0;if(landed&&i>=MOVEB0*BAYC)_a.x+=SHIFT;if(k===DK&&nodeGrp.visible)sc=0;
    _m.compose(_a,q,_s.setScalar(Math.max(1e-4,sc)));hubs.setMatrixAt(k,_m);}hubs.instanceMatrix.needsUpdate=true;}
  // floors of moved bays slide
  for(let b=MOVEB0;b<NB;b++)floors[b].position.x=nodeX(b*BAYC)+BAYC*CX/2+SHIFT*ease(cl((t-36.8)/1.8));
  // panels
  const bayVis=[];for(let b=0;b<NB;b++)bayVis.push(!(b>=MOVEB0&&moved&&!landed));
  for(let b=MOVEB0;b<NB;b++)bayOff[b]=landed?SHIFT:0;
  updateRoof(t<24.8,pL,sm(17.5,19.5,t),bayVis);
  glassMat.opacity=t<14.2?0:(t<24.8?lerp(0,.72,sm(14.2,15.2,t))*(1-sm(18,19.6,t)*.75):lerp(.23,.16,pA));
  glassMat.roughness=t<24.8?.6:.12;glassMat.emissive.set('#5a3418');glassMat.emissiveIntensity=t>=24.8?pA*.55:0;
  // sun
  const sunVis=sm(14.2,15.2,t)*(1-sm(19.2,20.2,t));
  arcMat.opacity=sunVis*.7;sunBall.material.opacity=sunVis;rayMat.opacity=sunVis*.28*sm(15,16,t);
  const sv=sunVec(172-110*sm(14.6,19.6,t),lerp(5.5,18.5,sm(14.6,19.6,t)));sunBall.position.copy(sv.v).multiplyScalar(R);
  {const ra=rays.geometry.attributes.position.array;for(let i=0;i<18;i++){npos(cells[(i*263+31)%NC].k[0],_a);ra.set([sunBall.position.x,sunBall.position.y,sunBall.position.z,_a.x,_a.y,_a.z],i*6);}rays.geometry.attributes.position.needsUpdate=true;}
  const dir=new THREE.Vector3(-30,48,30);if(sunVis>0)dir.lerp(sv.v.clone().multiplyScalar(60),sunVis);

  warmL.forEach(l=>l.intensity=pA*28);
  scene.background.copy(C.bg).lerp(new THREE.Color('#121314'),pA);scene.fog.color.copy(scene.background);
  groundMat.color.setScalar(1-pA*.55);
  const cut=sm(19.8,21.2,t)*(1-sm(24.2,25.4,t));clipPlane.constant=lerp(100,0.2,cut);
  flowMat.uniforms.t.value=t;flowMat.uniforms.op.value=sm(20.8,22,t)*(1-sm(24,24.8,t));
  intGrp.visible=t>19.8&&t<34.4;
  nodeGrp.visible=t>29&&t<34.6;nodeGrp.userData.kl.intensity=sm(29.6,31,t)*(1-sm(33.4,34.4,t))*2.2;
  const cpos=herm(K,t,1),ct=herm(K,t,2);cam.position.set(...cpos);cam.lookAt(...ct);
  const [ox,oy]=viewShift(t);cam.setViewOffset(W,H,ox,oy,W,H);cam.updateProjectionMatrix();
  labs.forEach((d,i)=>{const a=sm(WIN[i][0],WIN[i][0]+.6,t)*(1-sm(WIN[i][1]-.5,WIN[i][1],t));d.style.opacity=a;d.style.transform=`translateY(${(1-a)*8*u}px)`;});
  bars.forEach((b,i)=>{b.style.transform=`scaleX(${cl((t-WIN[i][0])/(WIN[i][1]-WIN[i][0]))})`;});
  tk.style.opacity=sm(.2,.8,t)*(1-sm(39.2,39.7,t));
  fadeOv.style.opacity=Math.max(1-sm(0,.8,t),sm(39.2,40,t));
  comp.render();return true;
};
